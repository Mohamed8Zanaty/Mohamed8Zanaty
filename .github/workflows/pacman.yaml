name: Generate pacman animation

on:
  schedule:
    # Every 12 hours, on the hour.
    # (The old "* */12 * * *" ran EVERY MINUTE during hours 0 and 12.)
    - cron: "0 */12 * * *"

  # Allows running it manually from the Actions tab
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "profile-summary-card-output/**"

# Never run two copies at once, so they can't fight over the `output` branch
concurrency:
  group: pacman-contribution-graph
  cancel-in-progress: false

jobs:
  generate:
    name: Generate contribution graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # needed to push to the `output` branch

    steps:
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Optional settings (defaults shown):
          # games: "pacman"                  # e.g. "pacman,breakout,snake"
          # player_style: "opportunistic"    # or "conservative" / "aggressive"
          # hide_month_labels: "false"

      - name: Push SVGs to the output branch
        # v3.1.0 runs on Node 16, which GitHub has retired; v5 runs on Node 24.
        # If v5 ever misbehaves, v4.2.0 is the previous version with the same inputs.
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
